# Stop the libinjection-based SQLi rule from inspecting the password field on
# any endpoint -- legitimate strong passwords routinely contain SQL-meta
# characters (quotes, dashes, semicolons) and would otherwise be blocked on
# every login/signup. This narrows rule 942100 away from ARGS:password only;
# the rule remains fully active for every other argument.
SecRuleUpdateTargetById 942100 "!ARGS:password"

# If XSS false positives appear on a free-text field (less likely for a
# password, but common for display name / bio fields), a similar narrow
# exclusion can be added here, e.g.:
# SecRuleUpdateTargetById 941100 "!ARGS:displayName"

SecAction "id:900200,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"