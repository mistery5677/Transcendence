<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/vite.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>frontend</title>
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background-color: #1c1c1a;
			}

			#root {
				min-height: 100vh;
			}

			.boot-screen {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				position: relative;
				overflow: hidden;
				color: #f3f4f6;
				background:
					repeating-linear-gradient(130deg, #3f3f46 0%, #292524 40%, #1c1917 80%, #0c0a09 120%), #171717;
				font-family:
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
			}

			.boot-screen::before,
			.boot-screen::after {
				content: "";
				position: absolute;
				border-radius: 999px;
				pointer-events: none;
				filter: blur(95px);
				opacity: 0.45;
			}

			.boot-screen::before {
				top: -120px;
				left: -130px;
				width: 340px;
				height: 340px;
				background: rgba(6, 95, 70, 0.65);
			}

			.boot-screen::after {
				right: -150px;
				bottom: -130px;
				width: 380px;
				height: 380px;
				background: rgba(101, 163, 13, 0.55);
			}

			.boot-card {
				position: relative;
				z-index: 1;
				width: min(90vw, 360px);
				text-align: center;
				padding: 28px 24px;
				border-radius: 24px;
				background: rgba(17, 24, 39, 0.64);
				border: 1px solid rgba(167, 243, 208, 0.2);
				box-shadow: 0 24px 50px -24px rgba(0, 0, 0, 0.85);
				backdrop-filter: blur(6px);
			}

			.boot-badge {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 64px;
				height: 64px;
				margin: 0 auto 14px;
				border-radius: 999px;
				border: 1px solid rgba(167, 243, 208, 0.34);
				background: rgba(52, 211, 153, 0.12);
			}

			.boot-knight {
				display: inline-block;
				font-size: 30px;
				line-height: 1;
				color: #bbf7d0;
				animation: spin 1.1s linear infinite;
			}

			.boot-title {
				margin: 0;
				font-size: 18px;
				font-weight: 700;
				letter-spacing: 0.02em;
				color: #f5f5f4;
			}

			.boot-subtitle {
				margin: 9px 0 0;
				font-size: 13px;
				color: #a8a29e;
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 0.35;
					transform: scale(0.92);
				}
				50% {
					opacity: 1;
					transform: scale(1);
				}
			}

			@keyframes spin {
				from {
					transform: rotate(0deg);
				}
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div
				class="boot-screen"
				aria-hidden="true">
				<div class="boot-card">
					<div class="boot-badge"><span class="boot-knight">♞</span></div>
					<p class="boot-title">Preparing your board...</p>
					<p class="boot-subtitle">Syncing your session and profile.</p>
				</div>
			</div>
		</div>
		<script
			type="module"
			src="/src/main.tsx"></script>
	</body>
</html>
